name: Tests
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  go-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files not formatted:"
            gofmt -d .
            exit 1
          fi

      - name: Run tests
        run: go test -v ./...

  docker-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        libc: [glibc, musl]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build CLI
        run: go build -o php-extension-builder .

      - name: Checkout example extension
        uses: actions/checkout@v6
        with:
          repository: asgrim/example-pie-extension
          path: ext

      - name: Build example extension
        working-directory: ext
        run: |
          ../php-extension-builder build \
            --package-version 0.0.0-test \
            --php-version 8.3 \
            --libc "${{ matrix.libc }}" \
            --apt-package zlib1g-dev \
            --apk-package zlib-dev \
            --configure-flag '--with-hello-name=FROM_CLI' \
            --configure-flag '--enable-example-pie-extension'

  macos-smoke:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Build CLI
        run: go build -o php-extension-builder .

      - name: Checkout example extension
        uses: actions/checkout@v6
        with:
          repository: asgrim/example-pie-extension
          path: ext

      - name: Build example extension
        working-directory: ext
        run: |
          ../php-extension-builder build \
            --target-os darwin \
            --package-version 0.0.0-test \
            --php-version 8.3 \
            --configure-flag '--with-hello-name=FROM_CLI' \
            --configure-flag '--enable-example-pie-extension'
