version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  disable:
    - errcheck
    - revive
  enable:
    - misspell
    - nakedret
  settings:
    staticcheck:
      checks:
        - "all"
        - "-ST1000"
        - "-ST1003"
        - "-ST1005"

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
