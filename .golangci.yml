version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  disable:
    - errcheck
    - revive
  enable:
    - misspell
    - nakedret

linters-settings:
  staticcheck:
    checks:
      - "all"
      - "-ST1005"

issues:
  exclude-use-default: true
  max-issues-per-linter: 0
  max-same-issues: 0
