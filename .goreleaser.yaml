version: 2

project_name: php-extension-builder

builds:
  - id: php-extension-builder
    binary: php-extension-builder
    main: ./main.go
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: php-extension-builder
    ids:
      - php-extension-builder
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
